# Test vlucht.sh tegen de echte adsb.lol API (GitHub-runners hebben internet).
name: Test vlucht.sh

on:
  workflow_dispatch:
  push:
    paths:
      - vlucht.sh
      - .github/workflows/test-vlucht.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruwe API-controle TRA6260
        run: |
          curl -sS --max-time 10 -o body.json -w 'HTTP %{http_code}\n' \
            https://api.adsb.lol/v2/callsign/TRA6260
          jq -c . body.json

      - name: Vliegende lijnvlucht zoeken rond Schiphol (250 nm)
        id: live
        run: |
          set -o pipefail
          CS=$(curl -sS --max-time 10 https://api.adsb.lol/v2/point/52.31/4.76/250 | jq -r '
            [.ac[] | select(.flight != null and .lat != null and (.alt_baro|type) == "number"
                            and .alt_baro > 10000 and (.flight | test("^(KLM|EZY|RYR|TRA|BAW|DLH|EJU)")))]
            | sort_by(.seen_pos // 999) | .[0].flight // "" | gsub("\\s+";"")')
          echo "Gekozen callsign: '$CS'"
          test -n "$CS"
          echo "callsign=$CS" >> "$GITHUB_OUTPUT"

      - name: Ruwe API-controle vliegend toestel (positie en route)
        run: |
          CS='${{ steps.live.outputs.callsign }}'
          curl -sS --max-time 10 -o body.json -w 'HTTP %{http_code}\n' "https://api.adsb.lol/v2/callsign/$CS"
          jq -c '.ac[0] | {hex, flight, r, t, alt_baro, gs, lat, lon, seen_pos}' body.json
          curl -sS --max-time 10 -o route.json -w 'HTTP %{http_code}\n' \
            "https://vrs-standing-data.adsb.lol/routes/${CS:0:2}/$CS.json" || true
          jq -c '{airport_codes, _airport_codes_iata, dest: (._airports | last | {iata, location})}' route.json || cat route.json

      - name: Script - TRA6260 (niet in de lucht)
        run: ./vlucht.sh TRA6260; echo "exit=$?"

      - name: Script - vliegend toestel
        run: ./vlucht.sh '${{ steps.live.outputs.callsign }}'; echo "exit=$?"

      - name: Script - foutafhandeling
        run: |
          ./vlucht.sh || echo "exit=$?"
          ADSB_API_BASE=https://api.adsb.lol/bestaat-niet ./vlucht.sh KLM1001 || echo "exit=$?"
